services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  spark:
    build:
      context: .
      dockerfile: docker/spark-hudi.Dockerfile
      args: {HUDI_VERSION: "1.1.1"}
    depends_on: [minio]
    volumes: ["./data:/opt/commerce/data"]
volumes:
  minio-data:
