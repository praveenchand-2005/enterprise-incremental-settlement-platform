[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-incremental-settlement-platform"
version = "2.0.0"
description = "Change-driven incremental settlement platform with Spark and Apache Hudi"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
